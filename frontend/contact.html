<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact Us — NTDCP</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="contact">
<div id="site-header"></div>

<header class="page-header">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / Contact Us</div>
    <h1>Contact Us</h1>
  </div>
</header>

<section class="section">
  <div class="container contact-wrap">
    <div class="info-card">
      <h3 style="margin-bottom:16px;">Programme Office</h3>
      <ul>
        <li><strong>Address</strong><br>40478 Government City, Afya Road, P.O. Box 743, Dodoma, Tanzania</li>
        <li><strong>Phone</strong><br>+255 756 90 78 67</li>
        <li><strong>Email</strong><br>info@ntdcp.go.tz</li>
        <li><strong>Office hours</strong><br>Monday – Friday, 7:30 – 15:30 EAT</li>
      </ul>
    </div>
    <div>
      <h3 style="margin-bottom:16px;">Send us a message</h3>
      <form id="contact-form" class="form-grid">
        <div>
          <label for="name">Full name</label>
          <input id="name" name="name" type="text" required>
        </div>
        <div>
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="full">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" required>
        </div>
        <div class="full">
          <label for="message">Message</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div class="full">
          <button type="submit" class="btn btn-primary">Send message</button>
          <p class="form-status" style="margin-top:10px;font-size:.9rem;"></p>
        </div>
      </form>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/main.js"></script>
</body>
</html>
