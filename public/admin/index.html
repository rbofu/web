<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTDCP Admin Panel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');
  :root{ --navy:#0a2a3f; --teal:#0e7a72; --line:#e2e7e4; --ink:#14201f; --muted:#7c8b89; --sand:#f6f7f5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--sand);color:var(--ink);}
  h1,h2{font-family:'Lora',serif;color:var(--navy);margin:0;}
  a{color:var(--teal);}
  .shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
  .sidebar{background:var(--navy);color:#cfe2ea;padding:22px 0;}
  .sidebar h1{color:#fff;font-size:1.05rem;padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:10px;}
  .sidebar button{
    display:block;width:100%;text-align:left;background:none;border:none;color:#cfe2ea;
    padding:11px 20px;font-size:.9rem;cursor:pointer;font-family:inherit;
  }
  .sidebar button:hover, .sidebar button.active{ background:rgba(255,255,255,.08); color:#fff; }
  .sidebar .logout{ margin-top:20px; border-top:1px solid rgba(255,255,255,.15); padding-top:16px; color:#f0b1a4; }
  main{ padding:32px 40px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  .btn{ background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:4px; font-weight:600; font-size:.85rem; cursor:pointer; }
  .btn.secondary{ background:#fff; color:var(--navy); border:1px solid var(--line); }
  .btn.danger{ background:#c0392b; }
  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  th,td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); font-size:.88rem; vertical-align:top; }
  th{ background:#fbfcfb; font-weight:600; color:var(--muted); text-transform:uppercase; font-size:.72rem; letter-spacing:.04em; }
  tr:last-child td{ border-bottom:none; }
  .row-actions button{ background:none; border:none; cursor:pointer; color:var(--teal); font-size:.82rem; font-weight:600; margin-right:10px; }
  .row-actions button.danger{ color:#c0392b; }
  .panel{ display:none; }
  .panel.active{ display:block; }
  .modal-bg{ position:fixed; inset:0; background:rgba(10,42,63,.5); display:none; align-items:center; justify-content:center; z-index:100; }
  .modal-bg.show{ display:flex; }
  .modal{ background:#fff; border-radius:6px; padding:28px; width:520px; max-width:92vw; max-height:88vh; overflow:auto; }
  .modal h2{ font-size:1.1rem; margin-bottom:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.82rem; font-weight:600; margin-bottom:5px; }
  .field input, .field textarea{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:.9rem; }
  .field textarea{ min-height:90px; resize:vertical; }
  .upload-cols{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  .upload-cols .sublabel{ display:block; font-size:.76rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .upload-cols input[type="file"]{ padding:7px; font-size:.82rem; }
  .upload-or{ text-align:center; font-size:.75rem; color:var(--muted); align-self:center; padding-top:20px; }
  .upload-preview{ margin-top:10px; max-width:160px; max-height:100px; border-radius:4px; border:1px solid var(--line); display:block; object-fit:cover; }
  .upload-hint{ font-size:.76rem; color:var(--muted); margin-top:6px; }
  .upload-status{ font-size:.78rem; margin-top:6px; }
  @media (max-width: 480px){
    .upload-cols{ grid-template-columns:1fr; }
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:20px; }
  .stat-form{ background:#fff; border:1px solid var(--line); border-radius:4px; padding:22px; max-width:480px; }
  .stat-form .field{ display:flex; justify-content:space-between; align-items:center; gap:14px; }
  .stat-form .field input{ width:140px; }
  .empty{ color:var(--muted); font-size:.9rem; padding:24px; text-align:center; }
</style>
</head>
<body>
<div class="shell">
  <div class="sidebar">
    <h1>NTDCP Admin</h1>
    <button data-panel="news" class="active">News</button>
    <button data-panel="events">Events</button>
    <button data-panel="activities">Activities</button>
    <button data-panel="diseases">Diseases</button>
    <button data-panel="partners">Partners</button>
    <button data-panel="resources">Resources</button>
    <button data-panel="statistics">Statistics</button>
    <button data-panel="messages">Contact Messages</button>
    <div style="margin:14px 20px 6px;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:#7c93a0;">Programme Calendar</div>
    <button data-panel="units">Organisational Units</button>
    <button data-panel="users">Staff Accounts</button>
    <button data-panel="mailOutbox">Mail Outbox</button>
    <a href="/calendar" target="_blank" style="display:block;padding:11px 20px;color:#9fd6cf;font-size:.9rem;text-decoration:none;">Open Programme Calendar ↗</a>
    <button class="logout" id="logoutBtn">Log out</button>
  </div>
  <main>
    <div class="topbar">
      <h1 id="panelTitle">News</h1>
      <button class="btn" id="addBtn">+ Add new</button>
    </div>
    <div id="panels"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg">
  <form class="modal" id="itemForm">
    <h2 id="modalTitle">Add item</h2>
    <div id="formFields"></div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>

<script src="app.js"></script>
</body>
</html>
