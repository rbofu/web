<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Profile — Program Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');
  :root{ --navy:#0a2a3f; --teal:#0e7a72; --line:#e2e7e4; --ink:#14201f; --muted:#7c8b89; --sand:#f6f7f5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--sand);color:var(--ink);}
  h1{font-family:'Lora',serif;color:var(--navy);margin:0;}
  #calNav{ background:#fff; border-bottom:1px solid var(--line); }
  .cn-inner{ max-width:1300px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:28px; height:60px; }
  .cn-brand{ display:flex; align-items:center; gap:8px; font-family:'Lora',serif; font-weight:700; color:var(--navy); text-decoration:none; font-size:1.05rem; }
  .cn-logo{ width:28px; height:28px; border-radius:6px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-size:.95rem; }
  .cn-tabs{ display:flex; gap:6px; flex:1; }
  .cn-tabs a{ padding:8px 14px; border-radius:4px; font-size:.9rem; font-weight:600; color:var(--muted); text-decoration:none; }
  .cn-tabs a:hover{ color:var(--navy); }
  .cn-tabs a.active{ background:var(--navy); color:#fff; }
  .cn-who{ display:flex; align-items:center; gap:14px; font-size:.85rem; color:var(--muted); white-space:nowrap; }
  .cn-who .cn-role{ color:var(--teal); font-weight:600; }
  .cn-who a{ color:var(--teal); text-decoration:none; }

  main{ max-width:640px; margin:0 auto; padding:26px 24px 60px; }
  .page-head{ margin-bottom:20px; }
  .page-head .sub{ color:var(--muted); font-size:.92rem; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:26px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:6px; }
  .field input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:.92rem; background:#fff; }
  .field input[disabled]{ background:var(--sand); color:var(--muted); }
  .hint{ font-size:.78rem; color:var(--muted); margin-top:5px; }
  .btn{ background:var(--navy); color:#fff; border:none; padding:12px 18px; border-radius:4px; font-weight:700; font-size:.92rem; cursor:pointer; width:100%; }
  .status{ margin-top:12px; font-size:.85rem; text-align:center; }
</style>
</head>
<body>
<div id="calNav"></div>
<main>
  <div class="page-head">
    <h1>My profile</h1>
    <div class="sub">Update your details and password for this account.</div>
  </div>
  <form class="card" id="profileForm">
    <div class="field"><label>Username</label><input id="p_username" disabled></div>
    <div class="field"><label>Full name</label><input id="p_name"></div>
    <div class="field"><label>Email</label><input id="p_email" type="email"></div>
    <div class="field"><label>Mobile number</label><input id="p_mobile"></div>
    <div class="field"><label>Highest level of education</label><input id="p_education" placeholder="e.g. Bachelor's degree"></div>
    <div class="field"><label>Unit</label><input id="p_unit" disabled></div>
    <div class="field"><label>Role</label><input id="p_role" disabled></div>
    <div class="field">
      <label>Report visibility privilege</label>
      <input id="p_privilege" disabled>
      <div class="hint">Set by an administrator. Controls which units' activities you can see.</div>
    </div>
    <div class="field"><label>New password</label><input id="p_password" type="password" placeholder="Leave blank to keep current password"></div>
    <button class="btn" type="submit">Save profile</button>
    <div class="status" id="status"></div>
  </form>
</main>
<script src="nav.js"></script>
<script src="profile.js"></script>
</body>
</html>
