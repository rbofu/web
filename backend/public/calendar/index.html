<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NTDCP Programme Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');
  :root{ --navy:#0a2a3f; --teal:#0e7a72; --gold:#e8a63b; --line:#e2e7e4; --ink:#14201f; --muted:#7c8b89; --sand:#f6f7f5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--sand);color:var(--ink);}
  h1,h2{font-family:'Lora',serif;color:var(--navy);margin:0;}
  a{color:var(--teal);}
  button{font-family:inherit;}

  header.topbar{ background:var(--navy); color:#fff; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  header.topbar h1{ color:#fff; font-size:1.2rem; }
  .who{ text-align:right; font-size:.82rem; color:#b7cbd6; }
  .who strong{ color:#fff; display:block; font-size:.9rem; }
  .who a{ color:#f0c98a; }

  /* Persistent top nav (shared across Calendar / Activity Reporting / Profile / Admin) */
  #calNav{ background:#fff; border-bottom:1px solid var(--line); }
  .cn-inner{ max-width:1300px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:28px; height:60px; }
  .cn-brand{ display:flex; align-items:center; gap:8px; font-family:'Lora',serif; font-weight:700; color:var(--navy); text-decoration:none; font-size:1.05rem; }
  .cn-logo{ width:28px; height:28px; border-radius:6px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-size:.95rem; }
  .cn-tabs{ display:flex; gap:6px; flex:1; }
  .cn-tabs a{ padding:8px 14px; border-radius:4px; font-size:.9rem; font-weight:600; color:var(--muted); text-decoration:none; }
  .cn-tabs a:hover{ color:var(--navy); }
  .cn-tabs a.active{ background:var(--navy); color:#fff; }
  .cn-who{ display:flex; align-items:center; gap:14px; font-size:.85rem; color:var(--muted); white-space:nowrap; }
  .cn-who .cn-role{ color:var(--teal); font-weight:600; }
  .cn-who a{ color:var(--teal); text-decoration:none; }

  .conflict-banner{ display:none; background:#fdeceb; border:1px solid #f0b8b3; color:#8a3a2e; border-radius:6px; padding:14px 18px; margin-bottom:20px; font-size:.88rem; line-height:1.6; }

  /* Officer timeline (Gantt-style) */
  .timeline-wrap{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:24px; margin-top:26px; overflow-x:auto; }
  .timeline-wrap h2{ font-size:1.1rem; }
  .timeline-wrap .sub{ color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .timeline-table{ border-collapse:collapse; font-size:.78rem; min-width:100%; }
  .timeline-table th, .timeline-table td{ border:1px solid var(--line); padding:4px; text-align:center; min-width:26px; position:relative; height:30px; }
  .timeline-table th{ background:#fbfcfb; font-weight:700; color:var(--muted); }
  .timeline-table td.officer-name{ text-align:left; font-weight:600; color:var(--navy); white-space:nowrap; min-width:170px; padding:4px 10px; }
  .timeline-table td.weekend{ background:#f6f1e8; }
  .timeline-bar{ position:absolute; inset:2px; border-radius:3px; color:#fff; font-size:.68rem; display:flex; align-items:center; padding:0 4px; overflow:hidden; white-space:nowrap; }
  .timeline-bar.conflict{ outline:2px solid #c0392b; outline-offset:-2px; }
  .timeline-legend{ display:flex; gap:20px; margin-top:14px; font-size:.8rem; color:var(--muted); align-items:center; }
  .timeline-legend .swatch{ display:inline-block; width:14px; height:14px; border-radius:2px; margin-right:6px; vertical-align:middle; }


  main{ max-width:1180px; margin:0 auto; padding:26px 24px 60px; }

  .toolbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:14px; margin-bottom:20px; }
  .toolbar .nav-controls{ display:flex; align-items:center; gap:10px; }
  .toolbar .nav-controls button{ background:#fff; border:1px solid var(--line); border-radius:4px; width:34px; height:34px; cursor:pointer; font-size:1rem; }
  .toolbar .nav-controls .today-btn{ width:auto; padding:0 14px; font-size:.85rem; font-weight:600; }
  .toolbar h2{ min-width:180px; }
  .toolbar .right-controls{ display:flex; gap:10px; align-items:center; }
  select{ padding:8px 12px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:.88rem; background:#fff; }
  .btn{ background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:4px; font-weight:600; font-size:.85rem; cursor:pointer; }
  .btn.secondary{ background:#fff; color:var(--navy); border:1px solid var(--line); }
  .btn.danger{ background:#c0392b; }

  .legend{ display:flex; flex-wrap:wrap; gap:14px; margin-bottom:16px; font-size:.82rem; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend .dot{ width:10px; height:10px; border-radius:50%; display:inline-block; }

  .cal-grid{ background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .cal-head, .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); }
  .cal-head div{ padding:10px; text-align:center; font-size:.76rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); background:#fbfcfb; border-bottom:1px solid var(--line); }
  .cal-day{ min-height:110px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); padding:6px; cursor:pointer; transition:background .1s; }
  .cal-day:hover{ background:#fbfcfb; }
  .cal-week > .cal-day:last-child{ border-right:none; }
  .cal-day.out{ background:#fafafa; color:#c7cfce; }
  .cal-day.today{ background:#eef8f6; }
  .cal-day .num{ font-size:.82rem; font-weight:600; margin-bottom:5px; }
  .cal-day.today .num{ color:var(--teal); }
  .chip{ display:block; font-size:.72rem; padding:2px 6px; border-radius:3px; color:#fff; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .more-link{ font-size:.72rem; color:var(--muted); margin-top:2px; }

  .modal-bg{ position:fixed; inset:0; background:rgba(10,42,63,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-bg.show{ display:flex; }
  .modal{ background:#fff; border-radius:6px; padding:26px; width:540px; max-width:100%; max-height:88vh; overflow:auto; }
  .modal h2{ font-size:1.1rem; margin-bottom:16px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:.82rem; font-weight:600; margin-bottom:5px; }
  .field input, .field textarea, .field select{ width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:.9rem; }
  .field textarea{ min-height:80px; resize:vertical; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .participant-picker{ display:flex; flex-wrap:wrap; gap:8px; max-height:130px; overflow-y:auto; border:1px solid var(--line); border-radius:4px; padding:10px; }
  .participant-picker label{ display:flex; align-items:center; gap:5px; font-size:.82rem; font-weight:400; background:var(--sand); padding:4px 9px; border-radius:12px; cursor:pointer; margin:0; }
  .participant-picker input{ width:auto; margin:0; }
  .participant-chip{ display:inline-flex; align-items:center; gap:5px; font-size:.72rem; font-weight:600; color:#fff; padding:2px 8px; border-radius:10px; margin:2px 4px 2px 0; }

  .upload-cols{ display:grid; grid-template-columns:1fr 1fr; gap:14px; align-items:start; }
  .upload-cols .sublabel{ display:block; font-size:.74rem; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .upload-cols input[type="file"]{ padding:6px; font-size:.8rem; }
  .upload-status{ font-size:.76rem; margin-top:5px; }
  .upload-preview{ margin-top:10px; max-width:100%; max-height:140px; border-radius:4px; border:1px solid var(--line); display:block; object-fit:cover; }
  .event-cover{ width:100%; max-height:200px; object-fit:cover; border-radius:4px; margin-bottom:14px; }
  .thumb-sm{ width:52px; height:40px; object-fit:cover; border-radius:3px; flex:none; }
  .modal-actions{ display:flex; justify-content:space-between; gap:10px; margin-top:20px; }
  .modal-actions .left{ display:flex; gap:10px; }
  .view-switch{ display:flex; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .view-switch button{ background:#fff; border:none; padding:8px 14px; font-size:.82rem; font-weight:600; color:var(--navy); cursor:pointer; border-right:1px solid var(--line); }
  .view-switch button:last-child{ border-right:none; }
  .view-switch button.active{ background:var(--navy); color:#fff; }

  .agenda-list{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px 20px; }
  .agenda-group{ padding:14px 0; border-bottom:1px solid var(--line); }
  .agenda-group:last-child{ border-bottom:none; }
  .agenda-group .date-label{ font-weight:700; color:var(--navy); font-size:.9rem; margin-bottom:8px; }
  .agenda-item{ display:flex; align-items:center; gap:10px; padding:6px 0; cursor:pointer; }
  .agenda-item:hover{ text-decoration:underline; }
  .agenda-item .dot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .agenda-item .cat{ font-size:.72rem; color:var(--muted); }

  .day-view-list{ background:#fff; border:1px solid var(--line); border-radius:6px; padding:20px; }

  .detail-tag{ display:inline-block; font-size:.72rem; font-weight:700; color:#fff; padding:3px 10px; border-radius:10px; margin-bottom:10px; }
  .detail-meta{ font-size:.85rem; color:var(--muted); margin-bottom:14px; }
  .detail-section{ margin-top:18px; padding-top:14px; border-top:1px solid var(--line); }
  .detail-section h3{ font-size:.85rem; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:10px; font-family:'Work Sans',sans-serif; font-weight:700; }
  .comment-item{ padding:8px 0; border-bottom:1px solid var(--line); font-size:.87rem; }
  .comment-item:last-child{ border-bottom:none; }
  .comment-item .who{ font-weight:600; color:var(--navy); }
  .comment-item .when{ font-size:.75rem; color:var(--muted); margin-left:6px; }
  .comment-item button.del{ background:none; border:none; color:#c0392b; font-size:.75rem; cursor:pointer; padding:0; margin-top:2px; }
  .comment-form{ display:flex; gap:8px; margin-top:10px; }
  .comment-form textarea{ flex:1; min-height:44px; padding:8px 10px; border:1px solid var(--line); border-radius:4px; font-family:inherit; font-size:.87rem; }
  .attachment-item{ display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); font-size:.87rem; }
  .attachment-item:last-child{ border-bottom:none; }
  .attachment-item .meta{ font-size:.75rem; color:var(--muted); }
  .attachment-item button.del{ background:none; border:none; color:#c0392b; font-size:.78rem; cursor:pointer; }
  .attach-form{ margin-top:10px; }
  .day-event-item{ border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin-bottom:8px; }
  .day-event-item .tag{ display:inline-block; font-size:.7rem; font-weight:700; color:#fff; padding:2px 8px; border-radius:10px; margin-bottom:6px; }
  .day-event-item h4{ margin:0 0 4px; font-size:.95rem; }
  .day-event-item .meta{ font-size:.78rem; color:var(--muted); margin-bottom:6px; }
  .day-event-item .actions{ display:flex; gap:12px; }
  .day-event-item .actions button{ background:none; border:none; color:var(--teal); font-size:.8rem; font-weight:600; cursor:pointer; padding:0; }
  .day-event-item .actions button.danger{ color:#c0392b; }
  .readonly-note{ font-size:.78rem; color:var(--muted); font-style:italic; }
  .empty{ color:var(--muted); font-size:.9rem; padding:16px 0; }

  @media (max-width: 760px){
    .cal-day{ min-height:70px; }
    .chip{ font-size:.65rem; }
    header.topbar{ flex-direction:column; align-items:flex-start; }
    .who{ text-align:left; }
  }
</style>
</head>
<body>

<div id="calNav"></div>

<main>
  <div class="conflict-banner" id="conflictBanner"></div>

  <div class="toolbar">
    <div class="nav-controls">
      <button id="prevBtn" aria-label="Previous">‹</button>
      <button id="todayBtn" class="today-btn">Today</button>
      <button id="nextBtn" aria-label="Next">›</button>
      <h2 id="monthLabel"></h2>
    </div>
    <div class="right-controls">
      <div class="view-switch" id="viewSwitch">
        <button data-view="month" class="active">Month</button>
        <button data-view="week">Week</button>
        <button data-view="day">Day</button>
        <button data-view="agenda">Agenda</button>
      </div>
      <select id="unitFilter"><option value="">All units I can see</option></select>
      <button class="btn" id="addActivityBtn">+ Add Activity</button>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <div class="cal-grid" id="calGrid">
    <div class="cal-head" id="calHead">
      <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
    </div>
    <div id="calBody"></div>
  </div>

  <div class="timeline-wrap" id="timelineWrap">
    <h2>Officer Timeline</h2>
    <div class="sub" id="timelineSub">Every officer's activities this month, at a glance.</div>
    <div style="overflow-x:auto;"><table class="timeline-table" id="timelineTable"></table></div>
    <div class="timeline-legend">
      <span><span class="swatch" style="background:#f6f1e8;border:1px solid var(--line);"></span>Weekend</span>
      <span><span class="swatch" style="background:#fff;border:2px solid #c0392b;"></span>Double-booked</span>
      <span>Bar color = officer</span>
    </div>
  </div>
</main>

<!-- Day detail / event list modal -->
<div class="modal-bg" id="dayModalBg">
  <div class="modal">
    <h2 id="dayModalTitle">Activities</h2>
    <div class="day-events" id="dayEventsList"></div>
    <div class="modal-actions">
      <div class="left"><button class="btn secondary" id="dayAddBtn">+ Add for this day</button></div>
      <button class="btn secondary" id="dayCloseBtn">Close</button>
    </div>
  </div>
</div>

<!-- Add/Edit event modal -->
<div class="modal-bg" id="eventModalBg">
  <form class="modal" id="eventForm">
    <h2 id="eventModalTitle">Add Activity</h2>
    <div class="field">
      <label for="ev_title">Title</label>
      <input id="ev_title" required>
    </div>
    <div class="field-row">
      <div class="field"><label for="ev_start">Start date</label><input id="ev_start" type="date" required></div>
      <div class="field"><label for="ev_end">End date</label><input id="ev_end" type="date" required></div>
    </div>
    <div class="field-row">
      <div class="field"><label for="ev_category">Category</label>
        <select id="ev_category">
          <option>Meeting</option><option>Training</option><option>Field Visit</option>
          <option>Campaign</option><option>Deadline</option><option>Activity</option>
        </select>
      </div>
      <div class="field"><label for="ev_unit">Unit</label><select id="ev_unit"></select></div>
    </div>
    <div class="field">
      <label>Cover image (optional)</label>
      <div class="upload-cols">
        <div>
          <span class="sublabel">Upload from device</span>
          <input type="file" id="ev_image_pick" accept="image/*">
          <div class="upload-status" id="ev_image_status"></div>
        </div>
        <div>
          <span class="sublabel">Or paste a URL</span>
          <input id="ev_image" type="text" placeholder="https://example.com/photo.jpg">
        </div>
      </div>
      <img id="ev_image_preview" class="upload-preview" style="display:none;">
    </div>
    <div class="field">
      <label for="ev_location">Location</label>
      <input id="ev_location">
    </div>
    <div class="field">
      <label>Participants</label>
      <div id="ev_participants" class="participant-picker"></div>
    </div>
    <div class="field">
      <label for="ev_reminder">Email reminder</label>
      <select id="ev_reminder">
        <option value="0">No reminder</option>
        <option value="1">1 day before</option>
        <option value="2">2 days before</option>
        <option value="3">3 days before</option>
        <option value="7">1 week before</option>
      </select>
    </div>
    <div class="field">
      <label for="ev_description">Description</label>
      <textarea id="ev_description"></textarea>
    </div>
    <div class="modal-actions">
      <button type="button" class="btn secondary" id="eventCancelBtn">Cancel</button>
      <button type="submit" class="btn">Save</button>
    </div>
  </form>
</div>

<!-- Event detail modal: full info, comments, attachments -->
<div class="modal-bg" id="detailModalBg">
  <div class="modal">
    <div id="detailBody"></div>
    <div class="modal-actions">
      <div class="left" id="detailManageActions"></div>
      <button class="btn secondary" id="detailCloseBtn">Close</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script src="app.js"></script>
</body>
</html>
