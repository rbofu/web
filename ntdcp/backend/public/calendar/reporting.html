<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Reporting — Program Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap');
  :root{ --navy:#0a2a3f; --teal:#0e7a72; --gold:#e8a63b; --line:#e2e7e4; --ink:#14201f; --muted:#7c8b89; --sand:#f6f7f5; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Work Sans',sans-serif;background:var(--sand);color:var(--ink);}
  h1,h2{font-family:'Lora',serif;color:var(--navy);margin:0;}
  a{color:var(--teal);}
  #calNav{ background:#fff; border-bottom:1px solid var(--line); }
  .cn-inner{ max-width:1300px; margin:0 auto; padding:0 24px; display:flex; align-items:center; gap:28px; height:60px; }
  .cn-brand{ display:flex; align-items:center; gap:8px; font-family:'Lora',serif; font-weight:700; color:var(--navy); text-decoration:none; font-size:1.05rem; }
  .cn-logo{ width:28px; height:28px; border-radius:6px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Lora',serif; font-size:.95rem; }
  .cn-tabs{ display:flex; gap:6px; flex:1; }
  .cn-tabs a{ padding:8px 14px; border-radius:4px; font-size:.9rem; font-weight:600; color:var(--muted); text-decoration:none; }
  .cn-tabs a:hover{ color:var(--navy); }
  .cn-tabs a.active{ background:var(--navy); color:#fff; }
  .cn-who{ display:flex; align-items:center; gap:14px; font-size:.85rem; color:var(--muted); white-space:nowrap; }
  .cn-who .cn-role{ color:var(--teal); font-weight:600; }
  .cn-who a{ color:var(--teal); text-decoration:none; }

  main{ max-width:1300px; margin:0 auto; padding:26px 24px 60px; }
  .page-head{ margin-bottom:20px; }
  .page-head .sub{ color:var(--muted); font-size:.92rem; }
  .conflict-banner{ display:none; background:#fdeceb; border:1px solid #f0b8b3; color:#8a3a2e; border-radius:6px; padding:14px 18px; margin-bottom:20px; font-size:.88rem; line-height:1.6; }

  table{ width:100%; border-collapse:collapse; background:#fff; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  th, td{ text-align:left; padding:11px 14px; border-bottom:1px solid var(--line); font-size:.85rem; vertical-align:top; }
  th{ background:#fbfcfb; font-weight:700; text-transform:uppercase; font-size:.72rem; letter-spacing:.04em; color:var(--muted); }
  tr:last-child td{ border-bottom:none; }
  tr.conflict-row{ background:#fdf2f0; }
  .status-badge{ display:inline-block; font-size:.7rem; font-weight:700; padding:2px 8px; border-radius:10px; }
  .status-upcoming{ background:#eef2f8; color:#33507a; }
  .status-ongoing{ background:#fdf3e3; color:#8a5b12; }
  .status-awaiting{ background:#fdece3; color:#b5541f; }
  .status-completed{ background:#e3f3ec; color:#1f7a52; }
  .chip{ display:inline-block; font-size:.7rem; font-weight:600; color:#fff; padding:2px 8px; border-radius:10px; margin:1px 3px 1px 0; }
  .row-actions a{ font-size:.82rem; font-weight:600; margin-right:10px; cursor:pointer; }
  .row-actions a.danger{ color:#c0392b; }
  .warn{ color:#c0392b; }
  .empty{ color:var(--muted); padding:20px; text-align:center; }

  .modal-bg{ position:fixed; inset:0; background:rgba(10,42,63,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .modal-bg.show{ display:flex; }
  .modal{ background:#fff; border-radius:6px; padding:26px; width:480px; max-width:100%; }
  .modal h2{ font-size:1.1rem; margin-bottom:14px; }
  .modal textarea{ width:100%; min-height:120px; padding:10px; border:1px solid var(--line); border-radius:4px; font-family:inherit; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top:16px; }
  .btn{ background:var(--teal); color:#fff; border:none; padding:9px 16px; border-radius:4px; font-weight:600; font-size:.85rem; cursor:pointer; }
  .btn.secondary{ background:#fff; color:var(--navy); border:1px solid var(--line); }
</style>
</head>
<body>
<div id="calNav"></div>
<main>
  <div class="page-head">
    <h1>Activity Reporting</h1>
    <div class="sub">Every activity logged across the program, with double-booking conflicts flagged.</div>
  </div>
  <div class="conflict-banner" id="conflictBanner"></div>
  <div id="tableWrap"><p class="empty">Loading…</p></div>
</main>

<div class="modal-bg" id="reportModalBg">
  <div class="modal">
    <h2 id="reportModalTitle">Completion report</h2>
    <textarea id="reportText" placeholder="What happened? Outcomes, attendance, follow-ups…"></textarea>
    <div class="modal-actions">
      <button class="btn secondary" id="reportCancelBtn">Cancel</button>
      <button class="btn" id="reportSaveBtn">Save report</button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script src="reporting.js"></script>
</body>
</html>
