<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login — NTDCP</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lora:wght@600&family=Work+Sans:wght@400;600&display=swap');
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a2a3f;font-family:'Work Sans',sans-serif;}
  .card{background:#fff;padding:40px;border-radius:6px;width:360px;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  h1{font-family:'Lora',serif;font-size:1.4rem;color:#0a2a3f;margin:0 0 4px;}
  p.sub{color:#7c8b89;font-size:.88rem;margin:0 0 24px;}
  label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px;color:#0a2a3f;}
  input{width:100%;padding:11px 13px;border:1px solid #e2e7e4;border-radius:4px;font-size:.95rem;}
  button{width:100%;margin-top:22px;padding:12px;background:#0e7a72;color:#fff;border:none;border-radius:4px;font-weight:600;font-size:.95rem;cursor:pointer;}
  button:hover{background:#148f85;}
  .err{color:#c0392b;font-size:.85rem;margin-top:12px;min-height:18px;}
  .hint{margin-top:18px;font-size:.78rem;color:#7c8b89;border-top:1px solid #e2e7e4;padding-top:14px;}
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>NTDCP Admin</h1>
    <p class="sub">Sign in to manage site content</p>
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
    <div class="hint">Default demo login: <strong>admin</strong> / <strong>ChangeMe123!</strong> — change this in <code>config.js</code> before deploying.</div>
  </form>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.textContent = '';
  const body = {
    username: document.getElementById('username').value,
    password: document.getElementById('password').value
  };
  const res = await fetch('/admin/login', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  if (res.ok){ window.location.href = '/admin'; }
  else { err.textContent = 'Invalid username or password.'; }
});
</script>
</body>
</html>
