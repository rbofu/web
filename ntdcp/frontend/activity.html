<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity — NTDCP</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="activities">
<div id="site-header"></div>

<header class="page-header">
  <div class="container">
    <div class="crumb"><a href="index.html">Home</a> / <a href="activities.html">Activities</a> / <span id="crumb-title">Activity</span></div>
    <h1 id="activity-title">Loading…</h1>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width:820px;">
    <div id="activity-body">
      <p>Loading activity details…</p>
    </div>
    <p style="margin-top:32px;"><a href="activities.html" class="btn btn-outline-navy">← Back to all activities</a></p>
  </div>
</section>

<div id="site-footer"></div>
<script src="assets/js/main.js"></script>
<script>
  (async function(){
    const id = new URLSearchParams(location.search).get('id');
    const titleEl = document.getElementById('activity-title');
    const crumbEl = document.getElementById('crumb-title');
    const bodyEl = document.getElementById('activity-body');
    if (!id){ titleEl.textContent = 'Activity not found'; bodyEl.innerHTML = '<p>No activity was specified.</p>'; return; }
    try{
      const res = await fetch('/api/activities/' + encodeURIComponent(id));
      if (!res.ok) throw new Error();
      const a = await res.json();
      titleEl.textContent = a.title;
      crumbEl.textContent = a.title;
      document.title = a.title + ' — NTDCP';
      bodyEl.innerHTML = `
        <p style="color:var(--ink-400);font-size:.9rem;">${a.category || 'Activity'} · ${new Date(a.date).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p>
        <div style="height:280px;border-radius:var(--radius);margin:16px 0 24px;background:${a.image ? `url('${a.image}') center/cover` : 'linear-gradient(135deg,#124d6e,#0e7a72)'};"></div>
        <p style="font-size:1.05rem;">${a.excerpt || ''}</p>
        <p>${(a.body || '').replace(/\n/g,'<br>')}</p>
      `;
    }catch(e){
      titleEl.textContent = 'Activity not found';
      bodyEl.innerHTML = '<p>We could not load this activity. It may have been removed.</p>';
    }
  })();
</script>
</body>
</html>
